aid: makrwatch
name: Makrwatch
description: >-
  Makrwatch is a creator representation and sponsorship management platform that
  sits between independent content creators and brands. It sources and filters
  brand-deal opportunities, negotiates terms and rates, protects creator IP and
  creative freedom, and handles the administrative work of briefs, timelines,
  revisions, invoicing, and payment tracking so creators can focus on producing
  content. Founded out of Y Combinator (W15) and based in New York City, the
  platform reports $27M+ distributed to creators across 34,000+ sponsorships for
  7,400+ creators operating in 118 countries. The company was founded in 2013 as
  themidgame and still operates its GitHub organization under that name. Makrwatch
  does not publish a public developer API or documentation surface at this time:
  there is no developer portal, API reference, OpenAPI, SDK, MCP server or agent
  card anywhere on its public surface, and its two AWS API Gateway hosts
  (api.makrwatch.com and platform.makrwatch.com) are private backends for its own
  Creators and Brands applications, answering every unauthenticated request with
  HTTP 403.
